name: build

on:
  push:
    branches: [main, dev]
    tags: ['v*.*.*']
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

# Group by source branch (head_ref on PR events, ref_name on push / tag /
# dispatch). Push to a branch with an open PR fires both `push` and
# `pull_request` events; this collapses them into one effective run, and
# also cancels stale in-flight runs when commits land in quick succession.
# Tag and main pushes land in their own groups, so they're never cancelled
# by activity on feature branches.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Default minimal scope; only the `release` job widens to `contents: write`
# to publish GitHub Releases.
permissions:
  contents: read

jobs:
  # `cargo release` pushes the version-bump commit to main and then pushes a
  # v* tag pointing at the same commit. Both pushes trigger this workflow on
  # different refs, so without a gate the whole pipeline runs twice. We
  # detect the release commit by its message (set in
  # `[package.metadata.release].pre-release-commit-message`) and propagate
  # the skip through `needs`. Message-matching beats `git tag --points-at
  # HEAD` here because the tag may not yet exist on the remote when the main
  # push fires.
  preflight:
    name: Detect cargo-release commit
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          MSG: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT" == "push" && "$REF" == "refs/heads/main" && "$MSG" == release:* ]]; then
            echo "skip=true" >>"$GITHUB_OUTPUT"
            echo "::notice::Skipping main-branch build for cargo-release commit; the v* tag push will run the full pipeline."
          else
            echo "skip=false" >>"$GITHUB_OUTPUT"
          fi

  # Cheap preflight that gates `release` and `publish`. Failing here costs
  # ~30s instead of ~20min of build / publish work on a mistyped tag.
  verify-tag:
    name: Verify tag ↔ Cargo.toml version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare tag with manifest
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(awk -F\" '/^version *=/ { print $2; exit }' Cargo.toml)
          if [[ "$tag" != "$manifest" ]]; then
            echo "::error::tag v$tag does not match Cargo.toml version $manifest"
            exit 1
          fi

  # Quality gates pinned to MSRV. `release` and `publish` depend on this so
  # a broken lint / failing test cannot ship to GitHub Releases or crates.io.
  lint:
    name: Lint & Test
    needs: preflight
    if: needs.preflight.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: lint

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: cargo test
        run: cargo test --locked

  changelog:
    name: Generate Changelog
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header

  build:
    name: Build (${{ matrix.target }})
    needs: [preflight, lint]
    # Branch pushes (main/dev) only run lint — the 3-platform matrix is
    # reserved for events that consume the artifacts: tag pushes (→ release
    # + publish), PRs (validate before merge), and manual dispatch.
    if: >-
      needs.preflight.outputs.skip != 'true'
      && (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: ssh-channels-hub-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: ssh-channels-hub-aarch64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: ssh-channels-hub-x86_64-pc-windows-msvc.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.91
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          tar czf ${{ matrix.archive }} \
            -C target/${{ matrix.target }}/release \
            ssh-channels-hub
          shasum -a 256 ${{ matrix.archive }} > ${{ matrix.archive }}.sha256

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/ssh-channels-hub.exe `
            -DestinationPath ${{ matrix.archive }}
          Get-FileHash -Algorithm SHA256 ${{ matrix.archive }} | `
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path -Leaf $_.Path)" } | `
            Out-File -Encoding ascii ${{ matrix.archive }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 14

  # Maturin packages the Rust CLI directly into platform-specific Python
  # wheels; no Python wrapper or interpreter is involved at runtime.
  wheels:
    name: Wheel (${{ matrix.target }})
    needs: [preflight, lint]
    if: >-
      needs.preflight.outputs.skip != 'true'
      && (github.event_name != 'push' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --strip
          manylinux: auto
          rust-toolchain: '1.91'
          sccache: 'true'

      - name: Upload wheel
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel-${{ matrix.target }}
          path: target/wheels/*.whl
          if-no-files-found: error
          retention-days: 14

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-tag, lint, build, changelog]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ssh-channels-hub-*
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body: ${{ needs.changelog.outputs.release_body }}
          fail_on_unmatched_files: true

  # Catch metadata regressions (missing license, bad `include`, broken
  # README link) before release. Runs on PRs and manual dispatch only —
  # tag pushes go through `publish` instead, and branch pushes skip this
  # to save CI minutes (PRs already cover pre-merge validation).
  publish-dry-run:
    name: cargo publish --dry-run
    needs: [preflight, lint]
    if: >-
      needs.preflight.outputs.skip != 'true'
      && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.91

      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-dry-run

      - run: cargo publish --dry-run --locked --registry crates-io

  publish:
    name: cargo publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-tag, lint, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.91

      - uses: Swatinem/rust-cache@v2
        with:
          key: publish

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --registry crates-io

  publish-pypi:
    name: PyPI publish
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify-tag, lint, wheels]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ssh-channels-hub
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          pattern: python-wheel-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
