# SSH Channels Hub configuration
#
# Host info (HostName / User / Port / IdentityFile) is read from ~/.ssh/config.
# This file only defines:
#   - which channels to bring up
#   - per-host credentials SSH config can't hold (password / passphrase)
#   - reconnection policy
#   - local Web status page settings
#
# Optional: point at a non-default SSH config path.
# ssh_config = "~/.ssh/config"

# --- Reconnection settings (documented defaults; uncomment fields to override) ---
[reconnection]
# max_retries = 0                       # default: 0 = unlimited
# initial_delay_secs = 1                 # default: 1 second
# max_delay_secs = 30                    # default: 30 seconds
# use_exponential_backoff = true         # default: true

# --- Local Web status page (documented defaults; uncomment fields to override) ---
[web]
# enabled = true                        # default: true
# port = 9090                           # default: 9090
# strict = false                        # default: false; try subsequent ports when occupied

# --- Per-host credential overrides (optional) ---
# Only needed when SSH config alone can't authenticate (password-auth host,
# or IdentityFile with a passphrase). Keyed by SSH config Host alias.

# [auth.example-server]
# passphrase = "key-passphrase"

# [auth.example-server2]
# password = "your-password-here"

# --- Channel definitions ---
# `hostname` is the SSH config Host alias.
# `local` / `remote` accept "host:port" (host defaults to 127.0.0.1) or an
# HTTP/HTTPS URL — they always mean the local / remote side, regardless of direction.
# Append new `[[channels]]` blocks below; nothing else needs to follow them.

[[channels]]
name      = "db-tunnel"
hostname  = "example-server"
direction = "local->remote"           # ssh -L: listen on `local`, forward to `remote`
local     = "3306"
remote    = "3306"

[[channels]]
name      = "web-tunnel"
hostname  = "example-server2"
direction = "local->remote"
local     = "0.0.0.0:8080"
remote    = "127.0.0.1:80"

# Expose a local service on the SSH server:
# [[channels]]
# name      = "expose-local-web"
# hostname  = "example-server"
# direction = "remote->local"         # ssh -R: server binds `remote`, bridge to `local`
# remote    = "8022"
# local     = "80"

# Default TCP mode: use for arbitrary TCP, end-to-end TLS, mTLS, or HTTP/2.
# HTTPS and WSS can share this tunnel without enabling http-gateway.
# An https:// endpoint only selects host/port; it does not terminate TLS.
# Clients must preserve the upstream hostname for certificate verification/Host.
# On the SSH server (URL path in local is ignored):
# curl --connect-to api.internal.example:443:127.0.0.1:18443 https://api.internal.example/v1
# Expose an internal HTTPS service resolved and dialed by this machine:
# [[channels]]
# name      = "internal-api"
# hostname  = "example-server"
# direction = "remote->local"
# remote    = "18443"
# local     = "https://api.internal.example/v1"  # URL path is not part of the TCP target

# Choose http-gateway when the daemon should handle upstream TLS/Host/SNI,
# and clients can use loopback http:// and ws:// URLs for one fixed upstream.
# This is HTTP/1.1 + WebSocket forwarding; no upstream mTLS configuration,
# HTTP/2 forwarding, or response redirect/cookie/HTML URL rewriting is provided.
# Applications generating absolute URLs may need their public/base URL adjusted.
# Optional: expose an HTTPS gateway as loopback HTTP on the SSH server.
# The client uses http://127.0.0.1:5443/v1; no remote /etc/hosts entry is needed.
# This mode requires remote->local, an HTTPS local URL or host:port (TLS),
# and a loopback remote bind. HTTP and WebSocket requests share the listener;
# clients use http:// or ws:// and the gateway connects via HTTPS or WSS.
# sshd_config must use GatewayPorts no or clientspecified, not GatewayPorts yes.
# [[channels]]
# name      = "llm-gateway"
# hostname  = "example-server"
# direction = "remote->local"
# remote    = "5443"
# local     = "https://gateway.internal.example"
# Alternative: local = "gateway.internal.example:443" (also uses TLS)
# Both forms support HTTPS and WSS; the URL path is ignored.
# mode      = "http-gateway"

# On the SSH server, with the gateway example enabled:
# curl http://127.0.0.1:5443/v1
# WebSocket client URL: ws://127.0.0.1:5443/<actual-websocket-path>
# Use the actual application path; the gateway does not add a path prefix.
