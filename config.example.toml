# SSH Channels Hub configuration
#
# Host info (HostName / User / Port / IdentityFile) is read from ~/.ssh/config.
# This file only defines:
#   - which channels to bring up
#   - per-host credentials SSH config can't hold (password / passphrase)
#   - reconnection policy
#   - local Web status page settings
#
# Optional: point at a non-default SSH config path.
# ssh_config = "~/.ssh/config"

# --- Reconnection settings (documented defaults; uncomment fields to override) ---
[reconnection]
# max_retries = 0                       # default: 0 = unlimited
# initial_delay_secs = 1                 # default: 1 second
# max_delay_secs = 30                    # default: 30 seconds
# use_exponential_backoff = true         # default: true

# --- Local Web status page (documented defaults; uncomment fields to override) ---
[web]
# enabled = true                        # default: true
# port = 9090                           # default: 9090
# strict = false                        # default: false; try subsequent ports when occupied

# --- Per-host credential overrides (optional) ---
# Only needed when SSH config alone can't authenticate (password-auth host,
# or IdentityFile with a passphrase). Keyed by SSH config Host alias.

# [auth.example-server]
# passphrase = "key-passphrase"

# [auth.example-server2]
# password = "your-password-here"

# --- Channel definitions ---
# `hostname` is the SSH config Host alias.
# `local` / `remote` accept "host:port" (host defaults to 127.0.0.1) or an
# HTTP/HTTPS URL — they always mean the local / remote side, regardless of direction.
# Append new `[[channels]]` blocks below; nothing else needs to follow them.

[[channels]]
name      = "db-tunnel"
hostname  = "example-server"
direction = "local->remote"           # ssh -L: listen on `local`, forward to `remote`
local     = "3306"
remote    = "3306"

[[channels]]
name      = "web-tunnel"
hostname  = "example-server2"
direction = "local->remote"
local     = "0.0.0.0:8080"
remote    = "127.0.0.1:80"

# Expose a local service on the SSH server:
# [[channels]]
# name      = "expose-local-web"
# hostname  = "example-server"
# direction = "remote->local"         # ssh -R: server binds `remote`, bridge to `local`
# remote    = "8022"
# local     = "80"

# Default TCP: preserves end-to-end TLS; supports HTTPS/WSS, mTLS and HTTP/2.
# On the SSH server, keep the upstream hostname for TLS verification and Host:
# curl --connect-to api.internal.example:443:127.0.0.1:18443 https://api.internal.example/v1
# [[channels]]
# name      = "https-tcp"
# hostname  = "example-server"
# direction = "remote->local"
# remote    = "18443"
# local     = "api.internal.example:443"
# mode      = "tcp"                   # default; may be omitted

# HTTP gateway: daemon handles upstream TLS/Host/SNI; clients use HTTP/WS.
# Requires remote->local, loopback remote, and GatewayPorts no or clientspecified.
# Both local forms below use TLS and support HTTPS/WSS; URL paths are ignored.
# [[channels]]
# name      = "https-gateway"
# hostname  = "example-server"
# direction = "remote->local"
# remote    = "5443"
# local     = "https://api.internal.example"  # or "api.internal.example:443"
# mode      = "http-gateway"
#
# On the SSH server:
# curl http://127.0.0.1:5443/v1
# WebSocket client URL: ws://127.0.0.1:5443/<actual-websocket-path>
# Mode selection and limitations: docs/configuration.md (Forwarding modes).
# Complete setup examples: docs/HowToUse.md (Access a fixed HTTPS/WSS service).
